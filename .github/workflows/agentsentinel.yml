name: AgentSentinel

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: agentsentinel-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff==0.17.2
      - name: Lint
        run: ruff check .
      - name: Formatting
        run: ruff format --check .

  typecheck:
    name: typecheck (mypy --strict)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt mypy==2.4.0
      - name: mypy
        run: mypy

  tests:
    name: tests (${{ matrix.os }})
    strategy:
      fail-fast: false            # see every OS's result, not just the first failure
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        shell: bash               # Git Bash on Windows, so one script works on all three
    env:
      GITLEAKS_VERSION: "8.30.1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Install Semgrep (isolated; installed together it downgrades the mcp library)
        run: pipx install semgrep || echo "::warning::Semgrep is not available on ${{ matrix.os }}; Semgrep tests are skipped"
      - name: Install Gitleaks
        run: |
          mkdir -p "$HOME/bin"
          case "${{ runner.os }}" in
            Linux)   asset="linux_x64.tar.gz" ;;
            macOS)   asset="darwin_arm64.tar.gz" ;;
            Windows) asset="windows_x64.zip" ;;
          esac
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_${asset}"
          curl -sSfL "$url" -o "$HOME/gitleaks_archive"
          if [ "${{ runner.os }}" = "Windows" ]; then unzip -o -q "$HOME/gitleaks_archive" -d "$HOME/bin"; else tar -xzf "$HOME/gitleaks_archive" -C "$HOME/bin"; fi
          echo "$HOME/bin" >> "$GITHUB_PATH"
      - name: Versions
        run: python --version && gitleaks version && (semgrep --version || true)
      - name: Unit + integration tests (no Claude calls)
        run: python -m pytest -q -rs

  merge-gate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
    env:
      GITLEAKS_VERSION: "8.30.1"
    steps:
      # The PR's code: scanned as data, never executed.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      # The gate's code comes from the base branch, so a PR cannot modify
      # the checker that judges it (or make it print the token).
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: _gate
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install scanners and Claude Code
        run: |
          pipx install semgrep
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          npm install -g @anthropic-ai/claude-code
          semgrep --version && gitleaks version && claude --version

      - name: Run AgentSentinel Merge Gate
        id: gate
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          AGENTSENTINEL_DB: ${{ runner.temp }}/agentsentinel.db
        run: |
          LLM_FLAG=""
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "::warning::CLAUDE_CODE_OAUTH_TOKEN not available (fork PR or secret missing): static scan only"
            LLM_FLAG="--no-llm"
          fi
          set +e
          python _gate/gate/run_gate.py --repo . --base "$BASE_SHA" --head "$HEAD_SHA" \
            --pr-body-env PR_BODY --label "PR #$PR_NUMBER" $LLM_FLAG \
            --comment-out "$RUNNER_TEMP/comment.md" --json-out "$RUNNER_TEMP/result.json"
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Post PR comment
        if: always() && steps.gate.outputs.exit_code != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/comment.md" --edit-last \
            || gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/comment.md"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agentsentinel-result
          path: ${{ runner.temp }}/result.json
          if-no-files-found: ignore

      - name: Enforce gate decision
        run: |
          if [ "${{ steps.gate.outputs.exit_code }}" != "0" ]; then
            echo "::error::AgentSentinel blocked this PR (see the PR comment for details)"
            exit 1
          fi
